<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seed Vault Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090e;color:#c9d1d9;font-family:system-ui,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:1.5rem 1rem}
.wrap{max-width:1400px;margin:0 auto}
header{text-align:center;margin-bottom:1.5rem}
h1{font-size:1.8rem;margin-bottom:.3rem;background:linear-gradient(135deg,#f7931a 40%,#627eea);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#6b7280;font-size:.88rem}
.panel{background:#0d1117;border:1px solid #1c2333;border-radius:16px;padding:1.2rem 1.5rem;margin-bottom:1rem}
.row{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end}
label{font-size:.75rem;color:#8b949e;display:block;margin-bottom:.3rem}
input[type=number]{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:.5rem .8rem;color:#f0f6fc;font-family:monospace;font-size:.9rem;width:180px}
input[type=number]:focus{outline:none;border-color:#f7931a}
.btn-gen{background:linear-gradient(135deg,#f7931a,#e07c12);border:none;padding:.7rem 1.8rem;border-radius:40px;font-weight:700;color:#0d1117;cursor:pointer;font-size:.9rem}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.btn-sec{background:#1f2a3a;border:1px solid #30363d;padding:.6rem 1.2rem;border-radius:40px;font-weight:600;color:#c9d1d9;cursor:pointer}
.btn-sec:hover{background:#2d3a4a}
.flex-btns{display:flex;gap:.6rem;flex-wrap:wrap}
.progress-bar{background:#1f2a3a;border-radius:20px;height:7px;width:100%;margin-top:.6rem;overflow:hidden}
.progress-fill{background:#f7931a;width:0%;height:100%;transition:width .2s}
.stats-row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.5rem}
.stat{background:#0a0e14;padding:3px 10px;border-radius:20px;font-family:monospace;font-size:.73rem}
.card{background:#0d1117;border:1px solid #1f2a3a;border-radius:16px;margin-bottom:1rem;overflow:hidden}
.card-header{background:#0a0e14;padding:.7rem 1.2rem;border-bottom:1px solid #1c2333;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.card-header h3{font-size:.9rem}
.table-wrapper{overflow-x:auto;max-height:420px;overflow-y:auto}
.addr-table{width:100%;border-collapse:collapse;font-size:.73rem}
.addr-table th{text-align:left;padding:9px 7px;background:#0a0e14;color:#8b949e;font-weight:600;border-bottom:1px solid #1f2a3a;position:sticky;top:0}
.addr-table td{padding:7px;border-bottom:1px solid #1a1f2a;font-family:'Courier New',monospace;word-break:break-all}
.addr-table tr:hover{background:#10151e}
.copy-btn{background:transparent;border:none;font-size:.95rem;cursor:pointer;padding:3px 7px;border-radius:5px;color:#8b949e}
.copy-btn:hover{background:#1f2a3a;color:#fff}
.toast-msg{position:fixed;bottom:20px;right:20px;background:#238636;color:#fff;padding:8px 16px;border-radius:8px;font-size:.8rem;z-index:1000;animation:fadeOut 2s ease forwards;pointer-events:none}
@keyframes fadeOut{0%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.warning-note{font-size:.7rem;color:#8b949e;background:#1c1012;padding:.5rem 1rem;border-radius:10px;margin-top:.5rem;border-left:3px solid #f85149}
.section-title{font-size:.78rem;color:#8b949e;margin-bottom:.4rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔐 Seed Vault Generator</h1>
    <p class="sub"></p>
  </header>

  <div class="panel">
    <div class="row">
      <div>
        <label>Number of addresses</label>
        <input type="number" id="countInput" min="1" max="30000" value="1" step="1">
      </div>
      <div>
        <label>Coins</label>
        <div class="coins-grid" id="coinsGrid"></div>
      </div>
    </div>
  </div>

  <div class="panel row" style="justify-content:space-between">
    <div>
      <div id="progressDisplay" style="font-size:.85rem;margin-bottom:.4rem">⚙️ Ready</div>
      <div class="flex-btns">
        <button id="startGenBtn" class="btn-gen">🚀 Generate</button>
        <button id="stopGenBtn" class="btn-sec" disabled>⏹ Stop</button>
      </div>
    </div>
    <div class="flex-btns">
      <button class="btn-sec" onclick="copyAddresses()">📋 Copy addresses</button>
      <button class="btn-sec" onclick="copyWithKeys()">🔐 Copy + keys</button>
      <button class="btn-sec" onclick="exportJSON()">💾 Export JSON</button>
      <button class="btn-sec" onclick="clearResults()">🗑 Clear</button>
    </div>
  </div>

  <div id="summaryPanel"></div>
  <div id="resultsContainer"><div style="text-align:center;padding:2rem;color:#6e7681">⚡ Press Generate to start</div></div>


</div>

const { secp256k1, sha256, ripemd160, keccak_256, base58check, bech32 } = NobleLibs;
const hex = b => Array.from(b, x => x.toString(16).padStart(2,'0')).join('');
const b58c = base58check(sha256);
const hash160 = d => ripemd160(sha256(d));
function toWIF(priv, prefix=0x80) {
  return b58c.encode(new Uint8Array([prefix, ...priv, 0x01]));
}
function eip55(bytes20) {
  const a = hex(bytes20);
  const h = hex(keccak_256(new TextEncoder().encode(a)));
  return '0x' + Array.from(a, (c,i) => parseInt(h[i],16)>=8 ? c.toUpperCase() : c).join('');
}
function ethAddr(priv) {
  const pub = secp256k1.getPublicKey(priv, false).slice(1);
  return eip55(keccak_256(pub).slice(-20));

// Fast master seed from password (single SHA256 — speed over KDF hardness)
async function vaultMasterSeed(password) {
  return sha256(new TextEncoder().encode(password));
}

// BIP39: entropy → mnemonic
function entropyToMnemonic(entropy) {
  const cs = sha256(entropy)[0] >> (8 - entropy.length / 4);
  const bits = [];
  for (const b of entropy) for (let i=7;i>=0;i--) bits.push((b>>i)&1);
  const csBits = entropy.length * 8 / 32;
  const csB = sha256(entropy)[0];
  for (let i=7;i>=8-csBits;i--) bits.push((csB>>i)&1);
  const words = [];
  for (let i=0;i<bits.length;i+=11) { let idx=0; for(let j=0;j<11;j++) idx=(idx<<1)|bits[i+j]; words.push(BIP39W[idx]); }
  return words.join(' ');
}

// BIP39: mnemonic → 64-byte seed via PBKDF2-HMAC-SHA512
async function mnemonicToSeed(mnemonic) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(mnemonic), {name:'PBKDF2'}, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt: enc.encode('mnemonic'), iterations:2048, hash:'SHA-512'},
    keyMat, 512
  );
  return new Uint8Array(bits);
}

// HMAC-SHA512 via WebCrypto
async function hmacSha512(key, data) {
  const k = await crypto.subtle.importKey('raw', key, {name:'HMAC', hash:'SHA-512'}, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', k, data));
}

// BIP32: seed → master key, then derive child at path m/44'/coinType'/0'/0/index
async function bip32Derive(seed, coinType, index) {
  // Master key
  let I = await hmacSha512(new TextEncoder().encode('Bitcoin seed'), seed);
  let kpar = I.slice(0, 32), cpar = I.slice(32);

  // Hardened derivation helper
  async function deriveHardened(k, c, i) {
    const data = new Uint8Array(37);
    data[0] = 0x00; data.set(k, 1);
    new DataView(data.buffer).setUint32(33, 0x80000000 | i, false);
    const res = await hmacSha512(c, data);
    const il = res.slice(0, 32), ir = res.slice(32);
    const n = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141n;
    const child = (BigInt('0x'+hex(il)) + BigInt('0x'+hex(k))) % n;
    const out = new Uint8Array(32);
    let tmp = child; for (let j=31;j>=0;j--) { out[j]=Number(tmp&0xFFn); tmp>>=8n; }
    return [out, ir];
  }

  // Normal derivation helper
  async function deriveNormal(k, c, i) {
    const pub = secp256k1.getPublicKey(k, true);
    const data = new Uint8Array(37);
    data.set(pub, 0);
    new DataView(data.buffer).setUint32(33, i, false);
    const res = await hmacSha512(c, data);
    const il = res.slice(0, 32), ir = res.slice(32);
    const n = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141n;
    const child = (BigInt('0x'+hex(il)) + BigInt('0x'+hex(k))) % n;
    const out = new Uint8Array(32);
    let tmp = child; for (let j=31;j>=0;j--) { out[j]=Number(tmp&0xFFn); tmp>>=8n; }
    return [out, ir];
  }

  // m/44'
  [kpar, cpar] = await deriveHardened(kpar, cpar, 44);
  // m/44'/coinType'
  [kpar, cpar] = await deriveHardened(kpar, cpar, coinType);
  // m/44'/coinType'/0'
  [kpar, cpar] = await deriveHardened(kpar, cpar, 0);
  // m/44'/coinType'/0'/0
  [kpar, cpar] = await deriveNormal(kpar, cpar, 0);
  // m/44'/coinType'/0'/0/index
  [kpar, cpar] = await deriveNormal(kpar, cpar, index);
  return kpar;
}
const COINS = [
  { id:'btc_legacy', name:'Bitcoin Legacy', icon:'₿', defaultOn:true, coinType:0,

    getAddr: p => { const raw=keccak_256(secp256k1.getPublicKey(p,false).slice(1)).slice(-20); return b58c.encode(new Uint8Array([0x41,...raw])); },
    getKey: p => hex(p) },
];
let selectedCoins = new Set(COINS.filter(c=>c.defaultOn).map(c=>c.id));
let generatedRecords = [];
let masterSeed = null;
let usedIndices = new Set();
let isRunning = false, stopRequested = false;

function randomUnusedIndex() {
  if (usedIndices.size >= 30000) return null;
  let idx;
  do { idx = Math.floor(Math.random() * 30000); } while (usedIndices.has(idx));
  usedIndices.add(idx);
  return idx;
}

function buildCoinsGrid() {
  const grid = document.getElementById('coinsGrid');
  grid.innerHTML = '';
  grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.3rem';
  for (const coin of COINS) {
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;align-items:center;gap:.4rem;background:#0a0e14;border:1px solid #1f2a3a;border-radius:8px;padding:.35rem .7rem;cursor:pointer;font-size:.78rem;user-select:none';
    label.innerHTML = `<input type="checkbox" ${selectedCoins.has(coin.id)?'checked':''} data-id="${coin.id}" style="accent-color:#f7931a;cursor:pointer"> ${coin.icon} ${coin.name}`;
    if (selectedCoins.has(coin.id)) label.style.borderColor = '#f7931a';
    label.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) { selectedCoins.add(coin.id); label.style.borderColor='#f7931a'; }
      else { selectedCoins.delete(coin.id); label.style.borderColor='#1f2a3a'; }
    });
    grid.appendChild(label);
  }
}
function toast(msg, err=false) {
  const d = Object.assign(document.createElement('div'),{className:'toast-msg',textContent:msg});
  if(err) d.style.background='#da3633';
  document.body.appendChild(d); setTimeout(()=>d.remove(),2100);
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  const ta = Object.assign(document.createElement('textarea'),{value:t,style:'position:fixed;opacity:0'});
  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
}
function renderTables() {
  const rc = document.getElementById('resultsContainer');
  if (!generatedRecords.length) {
    rc.innerHTML = '<div style="text-align:center;padding:2rem;color:#6e7681">⚡ Press Generate to start</div>';
    return;
  }
  const activeCoinIds = COINS.filter(c=>selectedCoins.has(c.id));
  let html = '';
  for (const coin of activeCoinIds) {
    const recs = generatedRecords.filter(r=>r[coin.id]);
    if (!recs.length) continue;
    html += `<div class="card"><div class="card-header"><h3>${coin.icon} ${coin.name}</h3><span style="font-size:.73rem;color:#8b949e">${recs.length} records</span></div>
    <div class="table-wrapper"><table class="addr-table">
    <thead><tr><th>Mnemonic</th><th>Address</th><th>Key</th><th></th></tr></thead><tbody>`;
    for (const rec of recs) {
      const {addr,key} = rec[coin.id];
      const ks = key.length>36 ? key.slice(0,32)+'…' : key;
      const mn = rec.mnemonic || '';
      html += `<tr><td style="font-size:.62rem;color:#a8d8a8;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${mn}">${mn}</td><td style="font-size:.7rem">${addr}</td>
        <td style="font-size:.7rem"><span title="${key}">${ks}</span></td>
        <td><button class="copy-btn" data-v="${addr}">📋</button></td></tr>`;
    }
    html += '</tbody></table></div></div>';
  }
  rc.innerHTML = html;
  rc.querySelectorAll('.copy-btn').forEach(b=>b.addEventListener('click',e=>{
    const v=e.currentTarget.dataset.v; copyText(v);
    e.currentTarget.textContent='✓'; setTimeout(()=>e.currentTarget.textContent='📋',800); toast('✓ Copied');
  }));
}

function updateStats() {
  const n=generatedRecords.length, total=parseInt(document.getElementById('countInput').value)||1;
  const pct = total>0 ? (n/total*100).toFixed(1) : 0;
  document.getElementById('summaryPanel').innerHTML=`<div class="stats-row">
    <span class="stat">📊 ${n.toLocaleString()} / ${total.toLocaleString()}</span>
    <span class="stat">📈 ${pct}%</span>
    <span class="stat">🪙 ${selectedCoins.size} coins</span>
  </div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  document.getElementById('progressDisplay').textContent =
    isRunning ? `⚙️ Generating… ${n}/${total}` : n>0 ? `✅ Done: ${n}` : '⚙️ Ready';
}
async function generateRecord(index) {
  // Deterministic entropy from master seed + index → always same mnemonic for same index
  const idxBytes = new Uint8Array(4);
  new DataView(idxBytes.buffer).setUint32(0, index, false);
  const data = new Uint8Array([...masterSeed, ...idxBytes]);
  const entropy = sha256(data).slice(0, 16);
  const mnemonic = entropyToMnemonic(entropy);
  const seed = await mnemonicToSeed(mnemonic);
  const rec = { mnemonic };
  for (const coin of COINS) {
    if (selectedCoins.has(coin.id)) {
      try {
        const priv = await bip32Derive(seed, coin.coinType, 0);
        rec[coin.id] = { addr: coin.getAddr(priv), key: coin.getKey(priv) };
      } catch(e) { rec[coin.id] = { addr: 'error', key: '' }; }
    }
  }
  return rec;
}

async function generationLoop(target) {
  let count = 0;
  const BATCH = 100;
  while (isRunning && !stopRequested && count < target) {
    const batch = [];
    for (let i = 0; i < BATCH && count + i < target; i++) {
      const idx = randomUnusedIndex();
      if (idx === null) { isRunning = false; break; }
      batch.push(generateRecord(idx));
    }
    const results = await Promise.all(batch);
    generatedRecords.push(...results);
    count += results.length;
    updateStats(); renderTables();
    await new Promise(r=>setTimeout(r,0));
  }
  isRunning = false;
  document.getElementById('startGenBtn').disabled = false;
  document.getElementById('stopGenBtn').disabled = true;
  if (stopRequested) { toast(`⏸ Stopped at ${generatedRecords.length}`); stopRequested=false; }
  else toast(`✅ Generated ${generatedRecords.length}`);
  updateStats(); renderTables();
}

async function startGeneration() {
  if (isRunning) return;
  if (!selectedCoins.size) { toast('Select at least one coin', true); return; }
  const target = Math.max(1, Math.min(30000, parseInt(document.getElementById('countInput').value)||1));
  document.getElementById('countInput').value = target;
  document.getElementById('startGenBtn').disabled = true;
  document.getElementById('stopGenBtn').disabled = false;
  document.getElementById('progressDisplay').textContent = '⚙️ Deriving seed…';
  if (!masterSeed) masterSeed = await vaultMasterSeed('X9#mK2$vL8@nQ5!wR3&pJ7*tF4^hD6~bN1+cG0-sY');
  isRunning = true; stopRequested = false;
  updateStats(); renderTables();
  generationLoop(target);
}

function stopGeneration() {
  stopRequested = true; isRunning = false;
  document.getElementById('startGenBtn').disabled = false;
  document.getElementById('stopGenBtn').disabled = true;
}
function copyAddresses() {
  if (!generatedRecords.length) { toast('No data', true); return; }
  const lines = [];
  for (const rec of generatedRecords) {
    for (const coin of COINS) if (rec[coin.id]) lines.push(`${coin.name}: ${rec[coin.id].addr}`);
    lines.push('');
  }
  copyText(lines.join('\n')); toast(`✓ Copied ${generatedRecords.length} records`);
}
function copyWithKeys() {
  if (!generatedRecords.length) { toast('No data', true); return; }
  const lines = [];
  for (const rec of generatedRecords) {
    if (rec.mnemonic) lines.push(`Mnemonic: ${rec.mnemonic}`);
    for (const coin of COINS) if (rec[coin.id]) {
      lines.push(`${coin.name}: ${rec[coin.id].addr}`);
      lines.push(`  Key: ${rec[coin.id].key}`);
    }
    lines.push('');
  }
  copyText(lines.join('\n')); toast(`✓ Copied ${generatedRecords.length} records with keys`);
}
function exportJSON() {
  if (!generatedRecords.length) { toast('No data', true); return; }
  const data = { generator:'Seed Vault', generatedAt:new Date().toISOString(), total:generatedRecords.length, records:generatedRecords };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  const a = Object.assign(document.createElement('a'),{href:url,download:`vault-${Date.now()}.json`});
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(`✓ Exported ${generatedRecords.length} records`);
}
function clearResults() {
  if (isRunning) stopGeneration();
  generatedRecords = []; usedIndices = new Set(); updateStats(); renderTables(); toast('🗑 Cleared');
}
document.getElementById('startGenBtn').onclick = startGeneration;
document.getElementById('stopGenBtn').onclick = stopGeneration;
buildCoinsGrid();
updateStats();
renderTables();
</script>
